name: Universidades RUCT España
on:
  push:
    branches: [main]
    paths: ['univ/ruct.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: univ-ruct
jobs:
  ruct:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u univ/ruct.py 2>&1 | tee univ/data/ruct.log
      - name: Guardar
        if: always()
        run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add -A univ/data/ruct.json univ/data/ruct.log
          git commit -m "univ: RUCT España" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 7; done
