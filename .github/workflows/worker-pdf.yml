# Publica el intermediario de PDF en Cloudflare Workers (plan gratuito).
# Necesita los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID; sin ellos no hace nada.
name: Intermediario de PDF (Cloudflare)
on:
  push: { branches: [main], paths: ['archivos/worker/**', '.github/workflows/worker-pdf.yml'] }
  workflow_dispatch:
  schedule: [{ cron: '17 6 * * *' }]   # cada día: si los secretos ya están y aún no se publicó, se publica solo
jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: write }
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar secretos
        id: s
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Faltan los secretos de Cloudflare: no se publica."; echo "ok=no" >> $GITHUB_OUTPUT; else echo "ok=si" >> $GITHUB_OUTPUT; fi
      - name: Publicar el Worker
        if: steps.s.outputs.ok == 'si'
        working-directory: archivos/worker
        run: |
          npx --yes wrangler@3 deploy 2>&1 | tee salida.txt
          U=$(grep -o 'https://[a-z0-9.-]*workers.dev' salida.txt | head -1)
          echo "Dirección: $U"
          echo "$U" > url.txt
      - name: Probar y guardar la dirección para la web
        if: steps.s.outputs.ok == 'si'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          U=$(cat archivos/worker/url.txt)
          [ -n "$U" ] || { echo "::error::No se obtuvo la dirección del Worker"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://aurzane.com' "$U/bib/paquete-tecnico-safer-mundo-libre-danos.pdf" -r 0-0)
          echo "Prueba con un PDF mudado: HTTP $code"
          mkdir -p publicar/aurzane.com/biblioteca
          echo "{\"url\": \"$U\"}" > publicar/aurzane.com/biblioteca/pdf-proxy.json
          if [ "$code" = 206 ] || [ "$code" = 200 ]; then
            git config user.name "AURZANE bot"; git config user.email "bot@aurzane.com"
            git add publicar/aurzane.com/biblioteca/pdf-proxy.json
            git diff --cached --quiet || { git commit -m "Intermediario de PDF activo: $U"; git push; gh workflow run desplegar.yml --ref main; }
          else echo "::warning::El Worker responde $code; no se activa en la web todavía"; fi
