name: Artículos en inglés
# Traduce y adapta al inglés los artículos de articulos_en/lista.txt (aurzane.com/en/articles/), con revisión de calidad,
# y los vuelve a generar si cambia su versión española. Cada día y al cambiar la lista o el programa.
on:
  schedule:
    - cron: '17 4 * * *'
  push:
    paths: ['articulos_en/lista.txt', 'articulos_en/traducir.py', '.github/workflows/articulos-en.yml']
  workflow_dispatch:
    inputs:
      max: {description: 'Artículos nuevos como máximo en esta pasada', default: '3'}
permissions:
  contents: write
  models: read
concurrency: articulos-en
jobs:
  traducir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX: ${{ github.event.inputs.max }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          echo "SSH=ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV
          echo "SG_DEST=$SG_USER@$SG_HOST" >> $GITHUB_ENV
      - name: Traducir y publicar
        run: python3 -u articulos_en/traducir.py
      - name: Guardar el estado
        if: always()
        run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add articulos_en/estado.json; git commit -qm "artículos en inglés: estado" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 7; done
