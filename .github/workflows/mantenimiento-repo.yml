name: Mantenimiento del repositorio
# Archiva y quita ramas que ya no se usan. Antes de quitar cada rama la guarda como etiqueta «archivo/<rama>»,
# así su contenido se puede recuperar siempre (git checkout archivo/<rama>). Nunca toca main ni material-clips.
# A mano (una rama) o escribiendo las ramas en mantenimiento/ramas.txt (una por línea).
on:
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama a archivar y quitar (nunca main)'
        required: true
  push:
    branches: [main]
    paths: ['mantenimiento/ramas.txt']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - env:
          RAMA: ${{ github.event.inputs.rama }}
        run: |
          L="$RAMA"; [ -z "$L" ] && L=$(grep -v '^\s*#' mantenimiento/ramas.txt | tr -d ' ')
          for b in $L; do
            case "$b" in main|material-clips) echo "$b no se toca"; continue;; esac
            git ls-remote --exit-code --heads origin "$b" >/dev/null || { echo "$b ya no existe"; continue; }
            git fetch -q origin "refs/heads/$b:refs/remotes/origin/$b"
            git push -q origin "refs/remotes/origin/$b:refs/tags/archivo/$b" && git push -q origin --delete "$b" && echo "::notice::$b archivada como archivo/$b y quitada"
          done
