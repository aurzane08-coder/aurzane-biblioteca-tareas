name: SEO con Search Console
# Lee las búsquedas reales de Google (solo lectura), mejora títulos y descripciones de las páginas con pocos clics
# y propone artículos sobre lo que la gente busca. Detalle en seo/seo.py. Conexión: aurzane.com/youtube/?cuenta=gsc
on:
  schedule:
    - cron: '41 4 * * *'
  push:
    paths: ['seo/seo.py', '.github/workflows/seo.yml']
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency: seo
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          echo "SSH=ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV
          echo "SG_DEST=$SG_USER@$SG_HOST" >> $GITHUB_ENV
      - name: Analizar y mejorar
        run: python3 -u seo/seo.py
      - name: Guardar
        run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add seo/*.json univ/data/gsc_titulos.json 2>/dev/null || git add seo/*.json
          git commit -qm "SEO: búsquedas de Search Console" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 7; done
