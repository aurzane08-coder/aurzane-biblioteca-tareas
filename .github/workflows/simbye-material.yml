name: Material de Simbye (una vez)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/simbye-material.yml']
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y preparar
        run: |
          mkdir -p /tmp/s && cd /tmp/s
          curl -sL -o plantillas.zip https://creatives.goaffpro.com/7193881/qaovalaa-simbye-social-templates.zip
          ls -la; unzip -o -q plantillas.zip -d plantillas; find plantillas -type f | head -60
          python3 - <<'P'
          import os, glob
          from PIL import Image
          fs = [f for f in glob.glob('/tmp/s/plantillas/**/*', recursive=True) if f.lower().endswith(('.png', '.jpg', '.jpeg', '.webp'))]
          for f in fs:
              try: im = Image.open(f); print(im.size, f)
              except Exception as e: print('x', f, e)
          os.makedirs(os.environ['GITHUB_WORKSPACE'] + '/univ/gen/simbye', exist_ok=True)
          n = 0
          for f in sorted(fs):
              im = Image.open(f).convert('RGB'); w, h = im.size
              tipo = 'cuadrado' if abs(w - h) < 20 else 'horizontal' if w > h * 1.5 else None
              if not tipo: continue
              n += 1; im.thumbnail((900, 900)); im.save(f"{os.environ['GITHUB_WORKSPACE']}/univ/gen/simbye/{tipo}-{n}.webp", 'WEBP', quality=78)
          print('guardadas', n)
          P
          cd $GITHUB_WORKSPACE; ls -la univ/gen/simbye
          git config user.name "AURZANE bot"; git config user.email "bot@aurzane.com"
          git add univ/gen/simbye && git commit -qm "Simbye: banners oficiales para NEXUS" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; done || true
