name: Prueba claves
on:
  push:
    paths: ['.github/workflows/prueba-claves.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      J: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          j = os.environ['J'].strip()
          print('::notice title=C::longitud', len(j))
          for extra in [{}, {'fuzzytags': 'ambient+piano'}, {'ccnc': 'false'}, {'ccnd': 'false'}, {'include': 'licenses', 'audioformat': 'mp32'}]:
              q = dict({'client_id': j, 'format': 'json', 'limit': 50}, **extra)
              d = json.load(urllib.request.urlopen('https://api.jamendo.com/v3.0/tracks/?' + urllib.parse.urlencode(q), timeout=60))
              h = d.get('headers', {}); r = d.get('results', [])
              lic = sorted({(t.get('license_ccurl') or '').split('licenses/')[-1][:12] for t in r})[:6]
              print('::notice title=C::', json.dumps(extra), h.get('status'), h.get('error_message', '')[:80], len(r), 'dl:', sum(1 for t in r if t.get('audiodownload_allowed')), lic)
          PY
