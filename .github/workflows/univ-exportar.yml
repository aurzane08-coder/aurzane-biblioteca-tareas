name: Universidades exportar Supabase
on:
  push:
    branches: [main]
    paths: ['univ/exportar.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u univ/exportar.py
      - name: Guardar
        run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add -A univ/data
          git commit -m "univ: exportación Supabase" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 7; done
