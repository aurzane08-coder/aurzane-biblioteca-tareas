name: Explorar RUCT lenguas (uso único)
on:
  push:
    paths: ['.github/workflows/explorar-ruct-lenguas.yml']
  workflow_dispatch:
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys, re
          sys.path.insert(0, 'univ')
          import ruct
          for act in ('menu.solicitud.basicos', 'menu.solicitud.centros', 'menu.solicitud.basicos.centros'):
              p = ruct.get(ruct.B + 'solicitud/detalles.action?cod=25039082024010901&sit=A&actual=' + act)
              t = ruct.limpio(p)
              print('ACT', act, len(t), 'MENU', sorted(set(re.findall(r'actual=(menu[^"&]*)', p)))[:30])
              for m in re.finditer(r'[Ll]engua|[Ii]dioma', t): print('E', t[max(0, m.start()-150):m.start()+250])
          PY
