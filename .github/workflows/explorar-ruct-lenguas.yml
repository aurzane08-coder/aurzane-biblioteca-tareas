name: Explorar RUCT lenguas (uso único)
on:
  push:
    paths: ['.github/workflows/explorar-ruct-lenguas.yml']
  workflow_dispatch:
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys, re
          sys.path.insert(0, 'univ')
          import ruct
          p = ruct.get(ruct.B + 'solicitud/detalles.action?cod=25039082024010901&sit=A&actual=menu.solicitud.basicos')
          hs = sorted(set(x.replace('&amp;', '&') for x in re.findall(r'href="([^"#]+)"', p) if 'solicitud' in x or '.action' in x))
          print('HREFS', hs)
          for l in hs:
              if 'centro' in l.lower() or 'basicos' in l.lower() or 'universidad' in l.lower():
                  u = l if l.startswith('http') else ('https://www.educacion.gob.es' + l if l.startswith('/') else ruct.B + 'solicitud/' + l)
                  q = ruct.limpio(ruct.get(u))
                  print('PAG', l[:90], len(q), q[q.find('Volver'):q.find('Volver') + 900])
                  for m in re.finditer(r'[Ll]engua|[Ii]dioma', q): print('E', q[max(0, m.start()-150):m.start()+300])
          PY
