name: Explorar RUCT lenguas (uso único)
on:
  push:
    paths: ['.github/workflows/explorar-ruct-lenguas.yml']
  workflow_dispatch:
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys, re
          sys.path.insert(0, 'univ')
          import ruct
          ruct.get(ruct.B + 'solicitud/detalles.action?cod=25039082024010901&sit=A&actual=menu.solicitud.basicos')
          p = ruct.get('https://www.educacion.gob.es/ruct/solicitud/universidades?actual=menu.solicitud.universidades&cod=25039082024010901')
          k = p.find('28051906'); print('LEN', len(p), k)
          print('RAW', re.sub(r'\s+', ' ', p[k-200:k+1800]))
          PY
