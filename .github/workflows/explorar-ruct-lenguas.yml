name: Explorar RUCT lenguas (uso único)
on:
  push:
    paths: ['.github/workflows/explorar-ruct-lenguas.yml']
  workflow_dispatch:
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys, re
          sys.path.insert(0, 'univ')
          import ruct
          p = ruct.get(ruct.B + 'solicitud/universidades?actual=menu.solicitud.universidades&cod=25039082024010901')
          hs = sorted(set(x.replace('&amp;', '&') for x in re.findall(r'href="([^"#]+)"', p)))
          print('HREFS', [h for h in hs if 'ruct' in h or 'action' in h or 'centro' in h.lower()])
          print('ONCLICK', re.findall(r'onclick="([^"]{0,200})"', p)[:10])
          for l in hs:
              if 'centro' in l.lower():
                  u = l if l.startswith('http') else ('https://www.educacion.gob.es' + l if l.startswith('/') else ruct.B + 'solicitud/' + l)
                  q = ruct.limpio(ruct.get(u))
                  print('PAG', l[:120], len(q), q[q.find('Volver'):q.find('Volver') + 1500])
          PY
