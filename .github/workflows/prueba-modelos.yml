name: Prueba IA gratis
on:
  push:
    paths: ['.github/workflows/prueba-modelos.yml']
permissions:
  models: read
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for m in openai/gpt-4.1-mini openai/gpt-4.1; do
            R=$(curl -s -w ' HTTP%{http_code}' https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Content-Type: application/json' -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Responde solo: hola desde $m\"}],\"max_tokens\":20}")
            echo "::notice title=Modelos::$m -> $(echo "$R" | tr -d "\n" | head -c 400)"
          done
          echo "::notice title=Modelos::doab $(curl -s -A 'Mozilla/5.0 (X11; Linux x86_64) Chrome/130.0' -o /dev/null -w '%{http_code}' 'https://directory.doabooks.org/rest/search?query=psicolog%C3%ADa&expand=metadata&limit=1')"
          echo "::notice title=Modelos::oapen $(curl -s -A 'Mozilla/5.0 (X11; Linux x86_64) Chrome/130.0' -o /dev/null -w '%{http_code}' 'https://library.oapen.org/rest/search?query=psychology&expand=metadata,bitstreams&limit=1')"
