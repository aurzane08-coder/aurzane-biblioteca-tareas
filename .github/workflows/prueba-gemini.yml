name: Prueba Gemini
on:
  push:
    paths: ['.github/workflows/prueba-gemini.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      K: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - run: |
          python3 - <<'PY'
          import os, json, urllib.request, time, re
          k = os.environ['K'].strip(); cab = {'Content-Type': 'application/json', 'x-goog-api-key': k}
          ms = json.load(urllib.request.urlopen(urllib.request.Request('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', headers=cab), timeout=60))['models']
          fl = [m['name'].split('/')[-1] for m in ms if 'generateContent' in m.get('supportedGenerationMethods', []) and 'flash' in m['name']]
          print('::notice title=G::flash: ' + ', '.join(fl)[:900])
          for m in fl[:8]:
              t0 = time.time()
              try:
                  r = json.load(urllib.request.urlopen(urllib.request.Request(f'https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent', data=json.dumps({'contents': [{'parts': [{'text': 'Puntúa de 1 a 10: «La paciencia es amarga, pero su fruto es dulce.» Responde solo el número.'}]}], 'generationConfig': {'maxOutputTokens': 50}}).encode(), headers=cab), timeout=90))
                  txt = ''.join(x.get('text', '') for x in r['candidates'][0]['content'].get('parts', []))
                  print('::notice title=G::', m, round(time.time() - t0, 1), 's ->', repr(txt[:60]), r['candidates'][0].get('finishReason'))
              except urllib.error.HTTPError as e: print('::notice title=G::', m, e.code, e.read()[:150])
              except Exception as e: print('::notice title=G::', m, 'ERR', str(e)[:80], round(time.time() - t0, 1))
          PY
