name: Research Hub
# Papers reales dentro de research.html (sin esperar a JavaScript) y búsquedas sugeridas que sí dan resultados.
# Corre cada día, después de cada despliegue y a mano.
on:
  schedule:
    - cron: '53 5 * * *'
  workflow_run:
    workflows: ['Desplegar archivos a SiteGround']
    types: [completed]
  push:
    paths: ['research/**', '.github/workflows/research.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: research
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          echo "SSH=ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV
          echo "SG_DEST=$SG_USER@$SG_HOST" >> $GITHUB_ENV
      - name: Diagnóstico de consultas
        run: python3 -u research/diagnostico.py
      - name: Papers dentro de la página
        run: if [ -f research/prerender.py ]; then python3 -u research/prerender.py; fi
      - name: Guardar
        run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add research/*.json 2>/dev/null; git commit -qm "research: actualización automática" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 7; done
