name: Awin buscar programas
on:
  push:
    paths: ['tienda/awin_buscar.py']
  workflow_dispatch:
    inputs:
      claves:
        description: 'Palabras separadas por comas (vacío = las de siempre)'
        default: ''
permissions:
  contents: read
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tienda/awin_buscar.py
        env:
          AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}
          CLAVES: ${{ github.event.inputs.claves || 'hipotec,mortgage,banco,bank,cuenta,n26,revolut,wise,finanz,financ,invest,inversi,broker,seguro,insurance,assur,prestamo,préstamo,loan,credit,crédito,tarjeta,myinvestor,indexa,bnext,renta,taxdown,impuesto,holded,factur,quaderno,iahorro,helpmycash,kelisto,rastreator,acierto,idealista,fotocasa,habitissimo,reforma,energ,luz,holaluz,ahorro,saving,money,dinero,pension,pensión,nomina,nómina,autonom,freelance,divisa,currency,transfer' }}
