name: OVP selector de idioma
# Añade el selector de idioma (aurzane-idiomas.js) a los tests de OVP directamente en el servidor,
# sin sustituir los archivos (en el servidor hay versiones más nuevas que en los repositorios).
# Antes de tocar nada guarda una copia en www/ovp.aurzane.com/eliminar/parche-idiomas-FECHA/.
on:
  push:
    paths: ['.github/workflows/parche-ovp-idiomas.yml']
  workflow_dispatch:
jobs:
  parche:
    runs-on: ubuntu-latest
    env:
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
    steps:
      - name: Insertar script
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          SSH="ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new"
          $SSH "$SG_USER@$SG_HOST" 'bash -s' <<'REMOTO'
          set -e
          cd www/ovp.aurzane.com/public_html
          B=../eliminar/parche-idiomas-$(date +%Y%m%d-%H%M); mkdir -p "$B"
          for f in af5-cliente.html apt-a-cliente.html apt-b-cliente.html chaside-cliente.html chte-cliente.html holland-cliente.html; do
            [ -f "$f" ] || { echo "falta $f"; continue; }
            if grep -q 'aurzane-idiomas.js' "$f"; then echo "ya estaba: $f"; continue; fi
            cp -p "$f" "$B/"
            sed -i '0,/<\/head>/s|</head>|<script src="https://aurzane.com/aurzane-idiomas.js?v=1" defer></script>\n</head>|' "$f"
            grep -c 'aurzane-idiomas.js' "$f" | sed "s|^|$f: |"
          done
          REMOTO
