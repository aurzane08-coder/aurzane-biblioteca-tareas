name: Versiones de archivos comunes
on:
  push:
    paths: ['ai/parches/versiones.py']
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:
  workflow_run:   # tras cada despliegue, para que las páginas nuevas entren el mismo día
    workflows: ['Desplegar archivos a SiteGround', 'Cursos y cifras reales', 'Diseño v4 en todo el sitio']
    types: [completed]
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          SSH="ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new $SG_USER@$SG_HOST"
          $SSH 'python3 - www' < ai/parches/versiones.py
          # vaciar la caché del servidor para que aurzane-paleta.js con las versiones nuevas llegue ya (si no, sirve la copia anterior)
          for d in aurzane.com mind.aurzane.com nexus.aurzane.com live.aurzane.com learn.aurzane.com build.aurzane.com ovp.aurzane.com; do
            $SSH "site-tools-client domain-all update id=$d flush_cache=1 >/dev/null 2>&1" || true
          done
          echo "Caché vaciada"
