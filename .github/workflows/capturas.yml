name: Capturas de diseño (navegador real)
# Hace capturas de las páginas de diseno/urls.txt (escritorio y móvil, tema claro y oscuro) y las deja en la rama «capturas».
# Lo que haya en diseno/borrador/<dominio>/<ruta> se muestra en lugar de lo publicado: sirve para revisar un cambio antes de desplegarlo.
on:
  workflow_dispatch:
    inputs:
      temas: {description: 'claro oscuro', default: 'claro oscuro'}
      vistas: {description: 'escritorio movil', default: 'escritorio movil'}
  push:
    paths: ['diseno/urls.txt', 'diseno/borrador/**', 'diseno/capturas.js']
permissions:
  contents: write
concurrency: {group: capturas, cancel-in-progress: true}
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Capturar
        run: |
          mkdir -p /tmp/pw && W=$PWD && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cd $W && TEMAS="${{ github.event.inputs.temas || 'claro oscuro' }}" VISTAS="${{ github.event.inputs.vistas || 'escritorio movil' }}" NODE_PATH=/tmp/pw/node_modules node diseno/capturas.js diseno/urls.txt /tmp/cap
      - name: Publicar en la rama capturas
        run: |
          cd /tmp/cap && git init -q -b capturas && git config user.name aurzane-bot && git config user.email bot@aurzane.com
          echo "${{ github.sha }}" > origen.txt && git add -A && git commit -qm "capturas ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas
