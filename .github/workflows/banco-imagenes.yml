name: Catálogo de imágenes (Pexels, sin ocupar espacio en el servidor)
# Mantiene banco/banco.json: miles de fotos reales de Pexels ordenadas por mundo y tema. Solo el índice vive en GitHub
# (la web lo lee por jsDelivr); las fotos se sirven desde el CDN de Pexels en AVIF. Nada se guarda en SiteGround.
on:
  push:
    paths: ['banco/banco.py', '.github/workflows/banco-imagenes.yml']
  schedule:
    - cron: '37 */2 * * *'   # cada 2 horas hasta llenar el catálogo (Unsplash demo: 50 peticiones por hora)
  workflow_dispatch:
    inputs:
      max: {description: 'Fotos por tema como máximo', default: '80'}
permissions:
  contents: write
concurrency: { group: banco-imagenes, cancel-in-progress: false }
jobs:
  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      MAX: ${{ github.event.inputs.max || '80' }}
    steps:
      - uses: actions/checkout@v4
      - name: Completar el catálogo
        run: |
          python3 banco/banco.py banco/banco.json | tee salida.txt
          if grep -q "HTTP Error 401" salida.txt; then echo "::warning title=Catálogo de imágenes::Una clave de fotos no es válida (Pexels o Unsplash). Hay que renovarla en GitHub > Settings > Secrets."; fi
      - name: Guardar el índice
        run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add banco/banco.json
          git diff --cached --quiet || { git commit -qm "catálogo de imágenes: índice actualizado"; for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done; }
          curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/banco/banco.json" | head -c 300; echo
