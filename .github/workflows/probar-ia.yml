name: Probar IA de respaldo (diagnóstico)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probar-ia.yml']
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Gemma y Gemini con la misma clave
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for m in gemma-3-27b-it gemma-3-12b-it gemini-flash-latest gemini-flash-lite-latest gemini-2.5-flash-lite; do
            echo "== $m texto"; curl -s -m 90 -w " HTTP %{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" -H "x-goog-api-key: $K" -H 'Content-Type: application/json' -d '{"contents":[{"parts":[{"text":"Responde solo con JSON {\"saludo\": \"hola\"}"}]}],"generationConfig":{"temperature":0.2}}' | tr -d '\n' | head -c 300; echo
            echo "== $m json"; curl -s -m 90 -w " HTTP %{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" -H "x-goog-api-key: $K" -H 'Content-Type: application/json' -d '{"contents":[{"parts":[{"text":"Devuelve {\"saludo\": \"hola\"}"}]}],"generationConfig":{"responseMimeType":"application/json"}}' | tr -d '\n' | head -c 200; echo
          done
          echo "== modelos gemma disponibles"; curl -s "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" -H "x-goog-api-key: $K" | grep -o '"name": "models/gem[^"]*"' | tr '\n' ' '
