name: Clips (Clips-All)
# Recorta vídeos autorizados de campañas de clipping (clips/fuentes.json) en Shorts verticales con subtítulos y los sube a Clips-All y a TikTok.
on:
  schedule:
    - cron: '17 8,13,19 * * *'   # 9:17, 14:17 y 20:17 en España: un clip en cada pasada
  push:
    paths: ['clips/fuentes.json', '.github/workflows/clips.yml', 'marketing/web/youtube/**']
  workflow_dispatch:
    inputs:
      verificar:
        description: 'Solo comprobar a qué cuentas van los clips (1)'
        default: ''
permissions:
  contents: write
  models: read
concurrency: clips
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YT_CLIENT_ID: "5296096526-v4h7ddqrv6stn3b251rbccguj63hpda3.apps.googleusercontent.com"
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      CLIPS_YT_CLIENT_ID: ${{ secrets.CLIPS_YT_CLIENT_ID }}
      CLIPS_YT_CLIENT_SECRET: ${{ secrets.CLIPS_YT_CLIENT_SECRET }}
      CLIPS_YT_REFRESH_TOKEN: ${{ secrets.CLIPS_YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Páginas de conexión y tokens (guardados fuera de la web)
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          SSH="ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new"; echo "SSH=$SSH" >> $GITHUB_ENV
          W=www/aurzane.com; P=$W/privado-youtube
          python3 -c 'import json,os;print(json.dumps({"client_id":os.environ["YT_CLIENT_ID"],"client_secret":os.environ["YT_CLIENT_SECRET"].strip()}))' | $SSH "$SG_USER@$SG_HOST" "mkdir -p $P && chmod 700 $P && cat > $P/app.json && chmod 600 $P/app.json"
          $SSH "$SG_USER@$SG_HOST" "mkdir -p $W/public_html/youtube"
          rsync -rlz --checksum -e "$SSH" marketing/web/youtube/ "$SG_USER@$SG_HOST:$W/public_html/youtube/"
          T=$($SSH "$SG_USER@$SG_HOST" "cat $P/refresh_clips 2>/dev/null" || true)
          [ -n "$T" ] && { echo "::add-mask::$T"; echo "CLIPS_YT_REFRESH_TOKEN=$T" >> $GITHUB_ENV; }
          T=$($SSH "$SG_USER@$SG_HOST" "cat $W/privado-tiktok/refresh_clips 2>/dev/null" || true)
          [ -n "$T" ] && { echo "::add-mask::$T"; echo "CLIPS_TIKTOK_REFRESH_TOKEN=$T" >> $GITHUB_ENV; }
          echo "::notice title=Clips::YouTube Clips-All: $(grep -q '^CLIPS_YT_REFRESH_TOKEN=' $GITHUB_ENV && echo conectado || echo sin conectar) · TikTok clips: $(grep -q '^CLIPS_TIKTOK_REFRESH_TOKEN=' $GITHUB_ENV && echo conectado || echo sin conectar)"
      - name: ¿Hay vídeos autorizados?
        id: hay
        run: python3 -c "import json;print('si=' + ('1' if any(f.get('autorizado') is True for f in json.load(open('clips/fuentes.json'))) else '0'))" >> $GITHUB_OUTPUT
      - name: Herramientas
        if: steps.hay.outputs.si == '1'
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
          pip install -q --break-system-packages faster-whisper yt-dlp
      - name: Material descargado en el ordenador (rama material-clips, en trozos de menos de 100 MB)
        if: steps.hay.outputs.si == '1'
        run: |
          mkdir -p /tmp/material
          if git fetch -q --depth=1 origin material-clips 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C /tmp/material
            for d in /tmp/material/*/; do [ -d "$d" ] && cat "$d"parte-* > "/tmp/material/$(basename "$d").mp4" && rm -rf "$d"; done
            ls -la /tmp/material
          fi
      - name: Hacer y subir clips
        if: steps.hay.outputs.si == '1'
        run: SOLO_VERIFICAR='${{ inputs.verificar }}' python3 -u clips/clips.py
      - name: Guardar registro
        if: steps.hay.outputs.si == '1'
        run: |
          [ -s /tmp/clips_tiktok_refresh ] && cat /tmp/clips_tiktok_refresh | $SSH "$SG_USER@$SG_HOST" "cat > www/aurzane.com/privado-tiktok/refresh_clips && chmod 600 www/aurzane.com/privado-tiktok/refresh_clips" || true
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add clips
          git commit -qm "clips: $(date +%F' '%H:%M)" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 20 + 5)); done   # en conflicto gana lo de esta ejecución
