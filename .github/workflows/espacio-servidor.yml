name: Espacio del servidor (informe)
# Solo lee: mide qué ocupa la cuenta de SiteGround para decidir qué mover fuera. No borra ni mueve nada.
# Vigilancia semanal (22/11/2026): si la cuenta pasa de 8 GB abre un aviso (issue) en GitHub, que llega por correo.
on:
  schedule:
    - cron: '7 6 * * 1'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/espacio-servidor.yml']
permissions:
  contents: read
  issues: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
    steps:
      - name: Vigilar el límite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          K=$(ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new $SG_USER@$SG_HOST 'du -sk ~ | cut -f1'); M=$((K/1024))
          echo "La cuenta usa $M MB"
          if [ "$M" -gt 8192 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "SiteGround casi lleno: $M MB" --body "La cuenta de SiteGround usa $M MB (aviso a partir de 8 GB). Revisa el informe del flujo «Espacio del servidor» para ver qué ha crecido." || true
          fi
      - name: Medir
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          SSH="ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new $SG_USER@$SG_HOST"
          $SSH 'set +e; cd ~/www
            echo "== copias: ficheros"; ls -la --time-style=+%F copias | head -5; find copias -type f -printf "%TY-%Tm-%Td %s %p\n" | sort | awk "{printf \"%s %6.0f MB %s\n\",\$1,\$2/1048576,\$3}" | tail -60; echo "n: $(find copias -type f | wc -l)"
            echo "== copias por mes"; find copias -type f -printf "%TY-%Tm %s\n" | awk "{t[\$1]+=\$2} END{for(k in t) printf \"%s %7.0f MB\n\",k,t[k]/1048576}" | sort
            echo "== quién escribe copias"; grep -rl "copias/" ~/herramientas 2>/dev/null | head; crontab -l 2>/dev/null | head -20
            echo "== marketing"; du -sh aurzane.com/public_html/marketing/* 2>/dev/null | sort -rh | head -20; find aurzane.com/public_html/marketing -type f -printf "%TY-%Tm\n" | sort | uniq -c
            echo "== biblioteca"; du -sh aurzane.com/public_html/biblioteca/* 2>/dev/null | sort -rh | head -10; find aurzane.com/public_html/biblioteca -name "*.pdf" | wc -l
            echo "== total y archivos (SiteGround limita también el número de archivos)"; du -sh ~ 2>/dev/null; echo "archivos: $(find ~ -xdev 2>/dev/null | wc -l)"
            echo "== por carpeta de la cuenta"; du -sh ~/* ~/.[!.]* 2>/dev/null | sort -rh | head -15
            echo "== por sitio"; for d in */; do printf "%s " "$d"; du -sh "$d" 2>/dev/null | cut -f1; printf "   archivos: %s\\n" "$(find "$d" -type f 2>/dev/null | wc -l)"; done
            echo "== carpetas eliminar"; find ~ -maxdepth 4 -type d -name eliminar 2>/dev/null | while read e; do echo "$(du -sh "$e" | cut -f1) $(find "$e" -type f | wc -l) archivos  $e"; done
            echo "== lo más grande de nexus"; du -sh nexus.aurzane.com/public_html/* 2>/dev/null | sort -rh | head -12
            echo "== restauracion y copias-supabase"; ls -la ~/restauracion-2026-11-19-1409 | head; ls ~/copias-supabase | tail -5; ls ~/copias-supabase | wc -l'
