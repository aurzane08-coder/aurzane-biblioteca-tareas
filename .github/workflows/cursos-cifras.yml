name: Cursos y cifras reales
# Catálogo de cursos, páginas de cada curso, títulos según lo que se busca, revisión de los cursos
# y cifras reales en toda la web. Corre cada día, después de cada despliegue y a mano.
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_run:
    workflows: ['Desplegar archivos a SiteGround']
    types: [completed]
  push:
    paths: ['cursos/catalogo.py', 'cursos/meta.json', 'cifras/cifras.py', '.github/workflows/cursos-cifras.yml']
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency: cursos-cifras
jobs:
  cifras:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          echo "SSH=ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV
          echo "SG_DEST=$SG_USER@$SG_HOST" >> $GITHUB_ENV
      - name: Cursos (catálogo, páginas, títulos y revisión)
        run: python3 -u cursos/catalogo.py
      - name: Cifras reales en la web
        run: python3 -u cifras/cifras.py
      - name: Guardar
        run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add cursos/meta.json cursos/seo.json cursos/salud.json cifras/cifras.json
          git commit -qm "cursos y cifras: actualización automática" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 7; done
