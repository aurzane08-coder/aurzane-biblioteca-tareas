name: Telegram libro del día
# Primer día: 15 libros de la biblioteca; después uno al día (hasta 365). Ver marketing/telegram_libros.py
on:
  schedule:
    - cron: '33 17 * * *'   # 18:33 en España
  workflow_dispatch:
permissions:
  contents: write
concurrency: telegram-libros
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u marketing/telegram_libros.py
      - name: Guardar
        run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add marketing/telegram_libros.json
          git commit -qm "Telegram: libro del día" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 20 + 5)); done
