name: Universidades publicar portal
# Cada noche: exporta Supabase (lo que se edita en el admin), regenera el portal y lo sube a nexus.
# La subida necesita estos secretos del repositorio (Settings > Secrets and variables > Actions):
#   SG_HOST  servidor SSH de SiteGround (p. ej. ssh.aurzane.com o la IP que indica Site Tools > Devs > SSH)
#   SG_USER  usuario SSH
#   SG_PORT  puerto SSH (SiteGround usa 18765)
#   SG_KEY   clave privada SSH generada en Site Tools > Devs > Gestor de claves SSH
#   SG_PASS  contraseña que se puso al crear esa clave (si se puso)
# Sin secretos, construye el portal y lo deja como artefacto descargable, sin subir nada.
on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 15 * * *'  # segunda pasada: los patrocinios aprobados por la mañana salen el mismo día
  workflow_dispatch:
  push:
    paths: ['univ/gen/**', 'univ/ciudades.py', 'univ/data/idiomas_grados.json', 'univ/data/imagenes.json', 'univ/data/ranking.json', 'univ/data/patrocinios.json']
permissions:
  contents: write
concurrency: univ-publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Exportar Supabase
        run: python3 -u univ/exportar.py
      - name: Datos básicos de cada país (REST Countries)
        run: python3 -u univ/paises_info.py univ/data || true
      - name: Vivir en cada ciudad (Wikidata, Wikipedia y Banco Mundial)
        run: MAX_CIUDADES=1500 timeout 1500 python3 -u univ/ciudades.py univ/data || true
      - name: Patrocinios aprobados (servidor) y avisos de fin
        if: env.SG_KEY != ''
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          SSH="ssh -i ~/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new"
          if $SSH "$SG_USER@$SG_HOST" "[ -f www/aurzane.com/public_html/patrocinio.php ] && php www/aurzane.com/public_html/patrocinio.php" > /tmp/activos.json; then
            python3 - <<'PY'
          import json
          f = 'univ/data/patrocinios.json'; d = json.load(open(f, encoding='utf-8'))
          act = json.load(open('/tmp/activos.json', encoding='utf-8'))
          manual = [x for x in d.get('lista', []) if x.get('manual')]   # altas a mano (campo manual: true) se respetan
          d['lista'] = manual + [x for x in act if x['id'] not in {m['id'] for m in manual}]
          json.dump(d, open(f, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('Patrocinios activos:', len(d['lista']))
          PY
          else echo "::notice::Sin lista de patrocinios del servidor"; fi
      - name: Generar portal
        run: python3 -u univ/gen/gen.py univ/data salida/universidades
      - name: Traducir al inglés los grados nuevos (Study in Spain)
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: |
          antes=$(md5sum univ/data/grados_en.json 2>/dev/null | cut -c1-32)
          python3 -u univ/traducir_grados.py || true
          despues=$(md5sum univ/data/grados_en.json 2>/dev/null | cut -c1-32)
          # si hay traducciones nuevas, se regenera para que ya salgan en esta publicación
          if [ "$antes" != "$despues" ]; then python3 -u univ/gen/gen.py univ/data salida/universidades; fi
      - name: Lista de archivos y retirados
        run: |
          (cd salida/universidades && find . -type f | sort) > univ/manifiesto-nuevo.txt
          touch univ/manifiesto.txt
          comm -23 univ/manifiesto.txt univ/manifiesto-nuevo.txt > retirados.txt || true
          echo "Retirados: $(wc -l < retirados.txt)"
      - name: Subir a nexus.aurzane.com
        if: env.SG_KEY != ''
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          SSH="ssh -i ~/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new"
          DEST="www/nexus.aurzane.com/public_html"
          rsync -az --checksum -e "$SSH" salida/universidades/ "$SG_USER@$SG_HOST:$DEST/universidades/"
          rsync -az -e "$SSH" salida/sitemap-universidades.xml "$SG_USER@$SG_HOST:$DEST/sitemap-universidades.xml"
          # versión en inglés «Study in Spain» (univ/gen/en.py): nexus.aurzane.com/en/
          if [ -d salida/en ]; then
            rsync -az --checksum -e "$SSH" salida/en/ "$SG_USER@$SG_HOST:$DEST/en/"
            rsync -az -e "$SSH" salida/sitemap-en.xml "$SG_USER@$SG_HOST:$DEST/sitemap-en.xml"
          fi
          # lo que ya no existe no se borra: se mueve a la carpeta eliminar (fuera de la web)
          if [ -s retirados.txt ]; then
            FECHA=$(date +%Y%m%d)
            sed 's#^\./##' retirados.txt | $SSH "$SG_USER@$SG_HOST" "cd www/nexus.aurzane.com && while read f; do [ -f public_html/universidades/\$f ] && mkdir -p \"eliminar/universidades-$FECHA/\$(dirname \$f)\" && mv \"public_html/universidades/\$f\" \"eliminar/universidades-$FECHA/\$f\"; done; true"
          fi
          $SSH "$SG_USER@$SG_HOST" "site-tools-client domain-all update id=nexus.aurzane.com flush_cache=1 >/dev/null 2>&1" || true   # que los cambios se vean al momento
          cp univ/manifiesto-nuevo.txt univ/manifiesto.txt
      - name: Guardar portal como artefacto
        if: env.SG_KEY == ''
        uses: actions/upload-artifact@v4
        with:
          name: portal-universidades
          path: salida/
          retention-days: 7
      - name: Guardar datos
        run: |
          rm -f univ/manifiesto-nuevo.txt
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add -A univ/data univ/manifiesto.txt
          git commit -m "univ: publicación automática" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 7; done
