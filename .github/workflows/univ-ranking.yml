name: Universidades ranking OpenAlex
# Cada mes descarga de OpenAlex (datos abiertos CC0) la producción científica de todas las instituciones
# educativas del mundo y guarda la posición mundial por citas en univ/data/ranking.json.
# Al guardarlo se regenera el portal de universidades (univ-publicar.yml) con el dato en fichas y comparador.
on:
  schedule:
    - cron: '41 2 3 * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 univ/ranking.py univ/data
      - run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add univ/data/ranking.json; git commit -qm "ranking OpenAlex: $(date +%F)" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
          gh workflow run univ-publicar.yml --ref main || true
        env:
          GH_TOKEN: ${{ github.token }}
