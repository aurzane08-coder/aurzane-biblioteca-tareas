name: Universidades EE. UU. (College Scorecard)
on:
  push:
    branches: [main]
    paths: ['univ/scorecard.py']
  schedule:
    - cron: '23 4 1 * *'   # cada mes: la fuente se actualiza varias veces al año
  workflow_dispatch:
permissions:
  contents: write
concurrency: univ-scorecard
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u univ/scorecard.py
      - name: Guardar
        run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add -A univ/data/scorecard.json univ/data/scorecard.log
          git commit -m "univ: College Scorecard EE. UU." || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 7; done
