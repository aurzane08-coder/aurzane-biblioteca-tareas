name: Universidades EE. UU. (College Scorecard)
on:
  push:
    branches: [main]
    paths: ['univ/scorecard.py']
  schedule:
    - cron: '23 * * * *'   # cada hora: sin clave propia la API solo deja ~10 consultas por hora; cuando está completo no consulta nada hasta el mes siguiente
  workflow_dispatch:
permissions:
  contents: write
concurrency: univ-scorecard
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Bajar por tandas (sin clave propia, unas 9 consultas por hora) y guardar cada tanda
        env:
          SCORECARD_KEY: ${{ secrets.SCORECARD_KEY }}
        run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          for t in 1 2 3 4 5 6; do
            python3 -u univ/scorecard.py
            git add -A univ/data/scorecard*
            git commit -qm "univ: College Scorecard EE. UU. (tanda $t)" && for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 7; done
            grep -q "bajadas" univ/data/scorecard.log || break   # completo
            [ $t -lt 6 ] && sleep 3700
          done
