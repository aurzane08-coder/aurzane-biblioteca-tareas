name: Diagnóstico de páginas (navegador real)
on:
  workflow_dispatch:
    inputs:
      urls: {description: 'URLs separadas por espacios', default: ''}
  push:
    paths: ['ai/diag/urls.txt']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Abrir las páginas y mostrar sus errores
        run: |
          mkdir -p /tmp/pw && W=$PWD && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          U="${{ github.event.inputs.urls }}"; [ -z "$U" ] && U=$(cat $W/ai/diag/urls.txt)
          NODE_PATH=/tmp/pw/node_modules node $W/ai/diag/diagnostico.js $U
