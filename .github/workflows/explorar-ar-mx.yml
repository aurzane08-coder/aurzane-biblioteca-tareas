name: Explorar fuentes Argentina y México (uso único)
on:
  push:
    paths: ['.github/workflows/explorar-ar-mx.yml']
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, re, json
          def g(u, data=None):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, data=data, headers={'User-Agent': 'Mozilla/5.0'}), timeout=40)
                  return r.status, r.read().decode('utf-8', 'replace')
              except Exception as e: return 0, str(e)
          import http.cookiejar, urllib.parse
          cj = http.cookiejar.CookieJar(); op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj)); op.addheaders = [('User-Agent', 'Mozilla/5.0')]
          B = 'https://sipes.siu.edu.ar'
          t = op.open(B + '/buscar_titulos_form.php', timeout=40).read().decode('latin-1')
          act = re.search(r"action='([^']+)'", t).group(1)
          ocultos = dict(re.findall(r"<input name='([^']+)' id='[^']*' type='hidden' value='([^']*)'", t))
          sel = re.findall(r"<select name='([^']+)'[^>]*>([\s\S]*?)</select>", t)
          for n, opts in sel: o = re.findall(r"<option[^>]*value='([^']*)'[^>]*>([^<]*)", opts); print('SELECT', n, len(o), o[:6])
          print('OCULTOS', ocultos)
          print('EVENTOS', sorted(set(re.findall(r"set_evento\(new evento_ei\('([^']+)'", t)))[:20], re.findall(r"(filtrar|buscar)[^\n]{0,80}", t)[:6])
          inst = re.findall(r"<option[^>]*value='([^']*)'[^>]*>([^<]*Buenos Aires[^<]*)", t)[:3]
          print('INST', inst)
          if inst:
              d = dict(ocultos); d['ef_form_2822_filtro_buscadorcod_institucion'] = inst[0][0]; d['ef_form_2822_filtro_buscadorcod_modalidad'] = 'nopar'; d['ef_form_2822_filtro_buscadorcod_nivel'] = 'G'
              for ev in ('filtrar', 'buscar'):
                  d['form_2822_filtro_buscador'] = ev
                  r = op.open(B + act, urllib.parse.urlencode(d).encode(), timeout=60).read().decode('latin-1')
                  txt = re.sub(r'\s+', ' ', re.sub(r'<script[\s\S]*?</script>|<[^>]+>', ' ', r))
                  filas = re.findall(r'<tr[^>]*>([\s\S]*?)</tr>', r)
                  celdas = [[re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', c)).strip() for c in re.findall(r'<td[^>]*>([\s\S]*?)</td>', f)] for f in filas]
                  celdas = [c for c in celdas if len(c) >= 3]
                  print('POST', ev, len(r), len(celdas)); [print('  FILA', c[:8]) for c in celdas[:12]]
                  print('  PAGINAS', re.findall(r'(?:P&aacute;gina|Página)[^<]{0,60}', r)[:3], re.findall(r'cuadro_2823[^"\']{0,60}pagina[^"\']{0,40}', r)[:3])
          PY
