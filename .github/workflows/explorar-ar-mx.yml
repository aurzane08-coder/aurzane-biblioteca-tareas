name: Explorar fuentes Argentina y México (uso único)
on:
  push:
    paths: ['.github/workflows/explorar-ar-mx.yml']
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, re, json
          def g(u, data=None):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, data=data, headers={'User-Agent': 'Mozilla/5.0'}), timeout=40)
                  return r.status, r.read().decode('utf-8', 'replace')
              except Exception as e: return 0, str(e)
          st, t = g('http://sipes.siu.edu.ar/buscar_titulos_form.php')
          print('FORM', st, len(t))
          print('FORMS', re.findall(r'<form[^>]*>', t))
          print('CAMPOS', re.findall(r'<(?:select|input|textarea)[^>]*>', t)[:40])
          sel = re.findall(r'<select[^>]*name="([^"]+)"[^>]*>([\s\S]*?)</select>', t)
          for n, opts in sel: o = re.findall(r'<option[^>]*value="([^"]*)"[^>]*>([^<]*)', opts); print('SELECT', n, len(o), o[:8])
          print('JS', re.findall(r'(?:url|ajax|\.php)[^;\n]{0,160}', t)[:20])
          PY
