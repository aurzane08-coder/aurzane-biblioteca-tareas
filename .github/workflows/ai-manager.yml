name: AURZANE AI Manager
# Cada 6 horas revisa todo el ecosistema, arregla lo seguro, anuncia las novedades, prepara la cola de propuestas y actualiza el panel (aurzane.com/admin.html, sección AURZANE AI).
# Cada 10 minutos mira (en segundos) si toca: revisión completa si pasaron 6 horas, o al momento si en el admin pulsaste
# «Revisar ahora» o aprobaste algo. La primera revisión de cada día desde las 06 UTC es la diaria (PageSpeed y resumen por Telegram).
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    paths: ['ai/manager.py', '.github/workflows/ai-manager.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ai-manager
  cancel-in-progress: false
jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH
        if: env.SG_KEY != ''
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          echo "SSH=ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV
          echo "SG_DEST=$SG_USER@$SG_HOST" >> $GITHUB_ENV
      - name: ¿Toca revisar?
        id: toca
        run: |
          T=0
          [ "${{ github.event_name }}" != "schedule" ] && T=1
          if [ -n "$SSH" ] && $SSH "$SG_DEST" "test -f www/aurzane.com/privado-ai/revisar_ya && rm -f www/aurzane.com/privado-ai/revisar_ya" 2>/dev/null; then T=1; echo "Pedida desde el admin"; fi
          V=$(python3 -c "import json,datetime as d;h=json.load(open('ai/historial.json'));print(1 if not h or (d.datetime.utcnow()-d.datetime.fromisoformat(h[-1]['fecha'])).total_seconds()>21000 else 0)" 2>/dev/null || echo 1)
          [ "$V" = "1" ] && T=1
          echo "si=$T" >> $GITHUB_OUTPUT; echo "Toca revisar: $T"
      - name: Herramientas PDF
        if: steps.toca.outputs.si == '1'
        run: command -v pdftoppm >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Revisar y arreglar
        if: steps.toca.outputs.si == '1'
        run: |
          [ "${{ github.event_name }}" = "push" ] && export DIARIO=1
          python3 -u ai/manager.py
      - name: Subir informe y novedades
        if: env.SG_KEY != '' && steps.toca.outputs.si == '1'
        run: |
          $SSH "$SG_DEST" "mkdir -p www/aurzane.com/privado-ai www/aurzane.com/public_html/novedades www/aurzane.com/public_html/biblioteca/recientes && chmod 700 www/aurzane.com/privado-ai"
          cat /tmp/ai/informe.json | $SSH "$SG_DEST" "cat > www/aurzane.com/privado-ai/informe.json && chmod 600 www/aurzane.com/privado-ai/informe.json"
          cat /tmp/ai/reparaciones.json | $SSH "$SG_DEST" "cat > www/aurzane.com/privado-ai/reparaciones.json && chmod 600 www/aurzane.com/privado-ai/reparaciones.json"
          cat /tmp/ai/propuestas.json | $SSH "$SG_DEST" "cat > www/aurzane.com/privado-ai/propuestas.json && chmod 600 www/aurzane.com/privado-ai/propuestas.json"
          rsync -rlz --checksum -e "$SSH" /tmp/ai/novedades/ "$SG_DEST:www/aurzane.com/public_html/novedades/"
          rsync -rlz --checksum -e "$SSH" /tmp/ai/recientes/ "$SG_DEST:www/aurzane.com/public_html/biblioteca/recientes/"
          $SSH "$SG_DEST" "mkdir -p www/aurzane.com/public_html/mapa"
          rsync -rlz --checksum -e "$SSH" /tmp/ai/mapa/ "$SG_DEST:www/aurzane.com/public_html/mapa/"
          [ -f /tmp/ai/sitemap-ai.xml ] && cat /tmp/ai/sitemap-ai.xml | $SSH "$SG_DEST" "cat > www/aurzane.com/public_html/sitemap-ai.xml" || true
          $SSH "$SG_DEST" "site-tools-client domain-all update id=aurzane.com flush_cache=1 >/dev/null" || true
      - name: Guardar historial
        if: steps.toca.outputs.si == '1'
        run: |
          git config user.name "aurzane-bot"; git config user.email "bot@aurzane.com"
          git add ai/*.json
          git commit -qm "ai: revisión $(date -u +%F' '%H:%M)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 7; done
