name: Compactar carpetas eliminar
# Una sola papelera para toda la web (pedido de Adrián, 23/11/2026): www/eliminar/ en SiteGround.
# 1. Lo que cualquier proceso deja en la carpeta eliminar de un mundo (www/<dominio>/eliminar/...) se mueve a www/eliminar/<dominio>/.
# 2. Cada carpeta con más de 6 horas se guarda en un solo archivo comprimido www/eliminar/comprimido/<dominio>-<nombre>.tar.gz.
#    Solo después de comprobar que el comprimido tiene exactamente los mismos archivos se quitan los sueltos.
#    Para recuperar algo: tar -xzf <archivo>.tar.gz
# 3. Los comprimidos con más de 30 días se borran solos (autorizado por Adrián el 23/11/2026). Fuera de www/eliminar/ no se borra nada.
# Corre cada 3 horas y después de los procesos que más copias dejan.
on:
  schedule:
    - cron: '37 */3 * * *'
  workflow_run:
    workflows: ['Desplegar archivos a SiteGround', 'Diseño v4 en todo el sitio', 'Universidades publicar portal', 'Imágenes para redes con fotos reales']
    types: [completed]
  workflow_dispatch:
  push:
    paths: ['.github/workflows/compactar-eliminar.yml']
permissions:
  contents: read
concurrency: compactar-eliminar
jobs:
  compactar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
    steps:
      - name: Juntar y compactar
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          SSH="ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 $SG_USER@$SG_HOST"
          $SSH 'bash -s' <<'FIN'
          set -u
          cd ~/www/
          P=eliminar; mkdir -p "$P/comprimido"
          echo "Antes: $(du -sh ~/ 2>/dev/null | cut -f1)"
          # 1. todo a la papelera única
          for e in */eliminar; do
            dom=${e%/eliminar}; [ "$dom" = eliminar ] && continue
            for x in "$e"/* "$e"/.[!.]*; do
              [ -e "$x" ] || continue
              n=$(basename "$x")
              if [ "$n" = comprimido ]; then
                for t in "$x"/*; do [ -e "$t" ] && mv -n -- "$t" "$P/comprimido/$dom-$(basename "$t")"; done; rmdir "$x" 2>/dev/null; continue
              fi
              mkdir -p "$P/$dom"; dest="$P/$dom/$n"; [ -e "$dest" ] && dest="$dest-$(date +%Y%m%d%H%M%S)"
              mv -- "$x" "$dest" && echo "  $x → $dest"
            done
          done
          # 2. comprimir lo que tiene más de 6 horas
          comp() {  # $1 carpeta padre, $2 nombre, $3 prefijo del comprimido
            local d="$1/$2" dest="$P/comprimido/$3$2.tar.gz" antes despues
            [ -e "$dest" ] && dest="$P/comprimido/$3$2-$(date +%Y%m%d%H%M%S).tar.gz"
            antes=$(find "$d" -type f | wc -l)
            [ "$antes" -eq 0 ] && { find "$d" -type d -empty -delete 2>/dev/null; return; }
            if tar -czf "$dest" -C "$1" "$2" && despues=$(tar -tzf "$dest" | grep -vc '/$') && [ "$despues" -eq "$antes" ]; then
              rm -rf -- "$d"; echo "  $d: $antes archivos → $(du -h "$dest" | cut -f1)"
            else
              echo "::warning::No se pudo comprobar $dest ($antes archivos): se dejan los sueltos"; rm -f -- "$dest"
            fi
          }
          for dom in $(find "$P" -mindepth 1 -maxdepth 1 -type d ! -name comprimido -name '*.*' -printf '%f\n'); do   # carpetas de cada dominio
            find "$P/$dom" -mindepth 1 -maxdepth 1 -mmin +360 -printf '%f\n' | while read -r n; do comp "$P/$dom" "$n" "$dom-"; done
            rmdir "$P/$dom" 2>/dev/null
          done
          find "$P" -mindepth 1 -maxdepth 1 -type d ! -name comprimido ! -name '*.*' -mmin +360 -printf '%f\n' | while read -r n; do comp "$P" "$n" ""; done
          # 3. limpieza: comprimidos de más de 30 días
          find "$P/comprimido" -maxdepth 1 -type f -name '*.tar.gz' -mtime +30 -print -delete | sed 's/^/  borrado (más de 30 días): /'
          echo "Papelera: $(du -sh "$P" | cut -f1), $(find "$P" -type f | wc -l) archivos · después: $(du -sh ~/ 2>/dev/null | cut -f1)"
          FIN
