name: Prueba IA gratis
on:
  push:
    paths: ['.github/workflows/prueba-modelos.yml']
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          def g(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 aurzane'}), timeout=60))
          try:
            d = g('https://api.openalex.org/works?filter=type:book,is_oa:true,primary_topic.field.id:32,from_publication_date:2024-06-01&sort=publication_date:desc&per-page=6&mailto=hola@aurzane.com')
            print('::notice title=P::total ' + str(d['meta']['count']))
            for w in d['results']:
              b = w.get('best_oa_location') or {}; p = w.get('primary_location') or {}
              print('::notice title=P::' + (w.get('title') or '')[:70] + ' | lang=' + str(w.get('language')) + ' | land=' + str(b.get('landing_page_url')) + ' | pdf=' + str(b.get('pdf_url')) + ' | lic=' + str(b.get('license')) + ' | src=' + str((b.get('source') or {}).get('display_name')) + ' | ids=' + json.dumps(w.get('ids'))[:160] + ' | abs=' + str(bool(w.get('abstract_inverted_index'))))
          except Exception as e: print('::notice title=P::oa ERR ' + repr(e)[:200])
          try:
            q = 'OPEN_ACCESS:y AND (PUB_TYPE:"review" OR PUB_TYPE:"systematic-review") AND (TITLE:"anxiety" OR TITLE:"depression" OR TITLE:"psychotherapy" OR TITLE:"mindfulness" OR TITLE:"burnout") AND FIRST_PDATE:[2026-10-01 TO 2026-11-02]'
            d = g('https://www.ebi.ac.uk/europepmc/webservices/rest/search?' + urllib.parse.urlencode({'query': q, 'format': 'json', 'pageSize': 4, 'resultType': 'core', 'sort': 'CITED desc'}))
            print('::notice title=P::epmc total ' + str(d.get('hitCount')))
            for r in d['resultList']['result']:
              print('::notice title=P::' + r.get('title','')[:80] + ' | ' + str(r.get('journalInfo',{}).get('journal',{}).get('title')) + ' | lic=' + str(r.get('license')) + ' | doi=' + str(r.get('doi')) + ' | pmcid=' + str(r.get('pmcid')) + ' | abs=' + str(len(r.get('abstractText',''))))
          except Exception as e: print('::notice title=P::epmc ERR ' + repr(e)[:200])
          try:
            q = 'OPEN_ACCESS:y AND LANG:spa AND (TITLE:"ansiedad" OR TITLE:"depresión" OR TITLE:"psicoterapia" OR TITLE:"estrés") AND FIRST_PDATE:[2026-01-01 TO 2026-11-02]'
            d = g('https://www.ebi.ac.uk/europepmc/webservices/rest/search?' + urllib.parse.urlencode({'query': q, 'format': 'json', 'pageSize': 3}))
            print('::notice title=P::epmc es total ' + str(d.get('hitCount')) + ' ' + ' || '.join(r.get('title','')[:60] for r in d['resultList']['result']))
          except Exception as e: print('::notice title=P::epmc es ERR ' + repr(e)[:200])
          for u in ['https://covers.openlibrary.org/b/isbn/9781800643000-M.jpg?default=false', 'https://www.bing.com/indexnow?url=https://aurzane.com/&key=x']:
            try:
              r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'}), timeout=30); print('::notice title=P::' + u[:40] + ' ' + str(r.status))
            except Exception as e: print('::notice title=P::' + u[:40] + ' ' + repr(e)[:120])
          PY
