name: Explorar ANUIES (uso único)
on:
  push:
    paths: ['.github/workflows/explorar-mx.yml']
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, re
          t = urllib.request.urlopen(urllib.request.Request('https://anuario.anuies.mx/', headers={'User-Agent': 'Mozilla/5.0'}), timeout=60).read().decode('utf-8', 'replace')
          print('ACCIONES', sorted(set(re.findall(r"append\(\s*'action'\s*,\s*'([^']+)'", t))))
          for m in list(re.finditer(r"'consulta|\"consulta|action', *'(consultar|datos|query|buscar)", t))[:3]:
              print('== C', re.sub(r'\s+', ' ', t[max(0, m.start()-200):m.start()+2500]))
          k = t.find('function buildFormData') if 'function buildFormData' in t else t.find('__anuiesSnapshot =')
          print('== B', re.sub(r'\s+', ' ', t[k:k+4000]))
          PY
