name: Material de Simbye (una vez)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/simbye-material.yml']
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y preparar
        run: |
          mkdir -p /tmp/s && cd /tmp/s
          curl -sL -o plantillas.zip https://creatives.goaffpro.com/7193881/qaovalaa-simbye-social-templates.zip
          ls -la; unzip -o -q plantillas.zip -d plantillas; find plantillas -type f | head -60
          pip install -q pillow
          python3 - <<'P'
          import os
          from PIL import Image
          d = os.environ['GITHUB_WORKSPACE'] + '/univ/gen/simbye'; os.makedirs(d, exist_ok=True)
          for f, n in [('simbye-social-pass_1200x628_en.png', 'horizontal-pass'), ('simbye-social-bigtype_1200x628_en.png', 'horizontal-big'),
                       ('simbye-social-pass_1080x1080_en.png', 'cuadrado-pass'), ('simbye-social-bigtype_1080x1080_en.png', 'cuadrado-big')]:
              im = Image.open('/tmp/s/plantillas/' + f).convert('RGB'); im.thumbnail((900, 900)); im.save(f'{d}/{n}.webp', 'WEBP', quality=80); print(n, im.size, os.path.getsize(f'{d}/{n}.webp'))
          P
          cd $GITHUB_WORKSPACE; ls -la univ/gen/simbye
          git config user.name "AURZANE bot"; git config user.email "bot@aurzane.com"
          git add univ/gen/simbye && git commit -qm "Simbye: banners oficiales para NEXUS" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; done || true
