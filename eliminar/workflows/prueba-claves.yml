name: Prueba claves
on:
  push:
    paths: ['.github/workflows/prueba-claves.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd marketing && python3 - <<'PY'
          import os, sys
          sys.path.insert(0, '.')
          import video
          for t in ('frase', 'test'):
              r = video.jamendo({'id': 'prueba-' + t, 'tipo': t})
              print('::notice title=C::Jamendo', t, '->', (r[1] if r else 'sin resultado'), (os.path.getsize(r[0]) if r else 0), 'bytes')
          PY
