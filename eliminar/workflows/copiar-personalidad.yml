name: Copiar test de personalidad al repositorio
# Uso único (23/11/2026): trae la página, los datos y el motor del test de personalidad para hacer su versión en inglés.
on:
  push:
    paths: ['.github/workflows/copiar-personalidad.yml']
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tests_en/personalidad_es
          for f in index.html datos.js test.js; do curl -sSf -A 'Mozilla/5.0 AURZANE' "https://mind.aurzane.com/test-de-personalidad/$f" -o tests_en/personalidad_es/$f; done
          ls -la tests_en/personalidad_es
          git config user.name "AURZANE bot"; git config user.email "bot@aurzane.com"
          git add tests_en/personalidad_es && git commit -qm "Test de personalidad: copia de la versión en español" && for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
