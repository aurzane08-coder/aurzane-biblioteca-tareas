name: CORS de los estilos y scripts compartidos
# Los subdominios cargan aurzane-ds.css y los scripts comunes de aurzane.com. Con Access-Control-Allow-Origin
# las herramientas de accesibilidad y el navegador pueden leer esos archivos públicos sin errores de CORS.
# Añade la regla al .htaccess de aurzane.com, guardando antes una copia en eliminar/; si la portada deja de responder, la deshace.
on:
  push:
    paths: ['.github/workflows/parche-cors.yml']
jobs:
  parche:
    runs-on: ubuntu-latest
    env:
      SG_KEY: ${{ secrets.SG_KEY }}
      SG_HOST: ${{ secrets.SG_HOST }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PORT: ${{ secrets.SG_PORT }}
      SG_PASS: ${{ secrets.SG_PASS }}
    steps:
      - run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/id && chmod 600 ~/.ssh/id
          if [ -n "$SG_PASS" ]; then ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/id >/dev/null; fi
          SSH="ssh -i $HOME/.ssh/id -p ${SG_PORT:-18765} -o StrictHostKeyChecking=accept-new"
          $SSH "$SG_USER@$SG_HOST" 'bash -s' <<'R' | sed 's/^/::notice title=htaccess::/'
          cd www/aurzane.com/public_html
          if grep -q 'cors-compartidos-aurzane' .htaccess; then echo "ya estaba"; else
            mkdir -p ../eliminar/htaccess-$(date +%Y%m%d-%H%M) && cp -p .htaccess ../eliminar/htaccess-$(date +%Y%m%d-%H%M)/
            cp -p .htaccess .htaccess.copia-cors
            printf '\n# cors-compartidos-aurzane: estilos y scripts comunes legibles desde los subdominios\n<IfModule mod_headers.c>\n<FilesMatch "^aurzane-.*\\.(js|css)$">\nHeader set Access-Control-Allow-Origin "*"\n</FilesMatch>\n</IfModule>\n' >> .htaccess
            if [ "$(curl -s -o /dev/null -w %{http_code} https://aurzane.com/)" != 200 ]; then cp -p .htaccess.copia-cors .htaccess; echo "deshecho: la portada dejó de responder"; else echo "añadido"; fi
            mkdir -p ../eliminar/htaccess-cors && mv .htaccess.copia-cors ../eliminar/htaccess-cors/; fi
          tail -7 .htaccess | tr '\n' ' '; echo
          site-tools-client domain-all update id=aurzane.com flush_cache=1 | tr '\n' ' '; echo
          echo "cabecera: $(curl -s -I https://aurzane.com/aurzane-ds.css | grep -i access-control | tr -d '\r')"
          R
