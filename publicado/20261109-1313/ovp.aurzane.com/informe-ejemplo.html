<p class="aviso">Ejemplo con <b>datos ficticios</b>. Así recibe cada estudiante su informe en su portal, generado automáticamente al terminar sus evaluaciones. La versión «colegio militar» añade una sección sobre la ESMIL y la ESFORSE.</p>

<script src="informe-v2.js?v=20261109b"></script>
<script>
(function(){
  // Perfiles ficticios y fijos (siempre salen igual)
  var PERFILES = {
    normal: { cha: ['S', 'I'], extra: 4, holland: ['I', 'S', 'A'], af5: { academico: 88, social: 90, emocional: 55, familiar: 92, fisico: 70 }, chteNo: [3, 4],
      cliente: { nombre: 'Lucía Andrade', edad: 17, sexo: 'F', curso: '3.º de Bachillerato' },
      membrete: { nombre_marca: 'Unidad Educativa de Ejemplo', subtitulo: 'Departamento de Consejería Estudiantil', color_banda: '#2E5AAC', color_texto_banda: '#FFFFFF', institucion: 'Unidad Educativa de Ejemplo' } },
    militar: { cha: ['D', 'I'], extra: 5, holland: ['R', 'E', 'S'], af5: { academico: 85, social: 92, emocional: 75, familiar: 90, fisico: 96 }, chteNo: [4],
      cliente: { nombre: 'Mateo Villacís', edad: 17, sexo: 'M', curso: '3.º de Bachillerato' },
      membrete: { nombre_marca: 'Colegio Militar de Ejemplo', subtitulo: "Consejería Estudiantil", color_banda: "#F5C400", color_texto_banda: '#14213D', institucion: 'Colegio Militar de Ejemplo', enfoque: 'militar' } }
  };
  function mostrar(tipo){
    var P = PERFILES[tipo], k, i;
    window.cha_responses = {}; window.af5_responses = {}; window.cht_responses = {}; window.holland_rows = [];
    var fuertes = [].concat(CHA_KEY_INTERESES[P.cha[0]], CHA_KEY_APTITUDES[P.cha[0]]).slice(1, 13);
    var segundas = [].concat(CHA_KEY_INTERESES[P.cha[1]], CHA_KEY_APTITUDES[P.cha[1]]).slice(0, 10);
    for(i = 1; i <= 98; i++) cha_responses[i] = (fuertes.indexOf(i) !== -1 || segundas.indexOf(i) !== -1 || i % 17 === 0) ? 'si' : 'no';
    for(i = 1; i <= 60; i++){
      var dim = HOLLAND_KEY[i - 1], pos = P.holland.indexOf(dim);
      holland_rows.push({ item_num: i, valor: (pos === 0 || (pos === 1 && i % 5) || (pos === 2 && i % 2)) ? 'Si' : 'No' });
    }
    for(k in AF5_DIMENSIONS) AF5_DIMENSIONS[k].items.forEach(function(n){ var v = P.af5[k]; if(AF5_DIMENSIONS[k].collectiveReversal) v = 100 - v; if(AF5_REVERSED_ITEMS.indexOf(n) !== -1) v = 100 - v; af5_responses[n] = v; });
    var c = 0, areaIdx = 0;
    Object.keys(CHT_AREAS).forEach(function(key){
      CHT_AREAS[key].items.forEach(function(_, j){ c++; cht_responses[c] = (P.chteNo.indexOf(areaIdx) !== -1 ? j % 3 === 0 : j % 4 !== 3) ? 'si' : 'no'; });
      areaIdx++;
    });
    var tests = ['chaside', 'holland', 'af5', 'chte'];
    var cliente = Object.assign({ activaciones: tests.map(function(t){ return { test_key: t, activo: true, completado: true, completado_at: '2026-10-20T10:00:00Z' }; }) }, P.cliente);
    generarInformeOVP(cliente, P.membrete, tests, null);
    document.getElementById('vNormal').setAttribute('aria-pressed', tipo === 'normal');
    document.getElementById('vMilitar').setAttribute('aria-pressed', tipo === 'militar');
  }
  document.getElementById('vNormal').onclick = function(){ mostrar('normal'); history.replaceState(null, '', '?'); };
  document.getElementById('vMilitar').onclick = function(){ mostrar('militar'); history.replaceState(null, '', '?tipo=militar'); };
  mostrar(/tipo=militar/.test(location.search) ? 'militar' : 'normal');
})();
</script>
