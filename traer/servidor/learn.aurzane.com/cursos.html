<script>
  // Observabilidad de errores (mismo patrón que el resto de AURZANE): sin datos de usuario.
  window.__aurzaneErrBuf = [];
  window.__aurzaneLogErr = function(msg){
    var entry = { pagina: location.pathname, mensaje: String(msg == null ? 'Error desconocido' : msg).slice(0,300) };
    if (window.__aurzaneSb && window.__aurzaneSb.from) { window.__aurzaneSb.from('frontend_error_log').insert(entry).then(function(){}, function(){}); }
    else { window.__aurzaneErrBuf.push(entry); }
  };
  window.addEventListener('error', function(e){ window.__aurzaneLogErr(e && e.message); });
  window.addEventListener('unhandledrejection', function(e){ var r = e && e.reason; window.__aurzaneLogErr((r && r.message) || 'Promise rechazada'); });
</script>
