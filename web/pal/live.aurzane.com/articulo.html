<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://aurzane.com/aurzane-paleta.js"></script>
<title id="pageTitle">Artículo — AURZANE</title>
<meta name="description" id="pageDesc" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/aurzane-id.js"></script>
<style>
  :root{
    --bg:#FAF6EC; --ink:#211A10; --ink-2:#4B4030; --ink-3:#8A7C64; --line:rgba(33,26,16,0.13);
    --accent:#9C7327; /* se sobreescribe según el mundo, ver JS */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:'Instrument Sans',sans-serif;line-height:1.7;}
  .topbar{padding:16px 5vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .breadcrumb{font-family:'Bodoni Moda',serif;font-style:italic;font-size:0.85rem;color:var(--ink-3);}
  .breadcrumb a{color:var(--ink-3);text-decoration:none;}
  .breadcrumb a:hover{color:var(--accent);}
  .breadcrumb .sep{margin:0 6px;}
  main{max-width:720px;margin:0 auto;padding:6vh 5vw 10vh;}
  h1{font-family:'Bodoni Moda',serif;font-weight:500;font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:14px;}
  .meta{color:var(--ink-3);font-size:0.86rem;margin-bottom:32px;font-family:'Bodoni Moda',serif;font-style:italic;}
  .resumen{font-size:1.1rem;color:var(--ink-2);margin-bottom:32px;}
  .cuerpo{font-size:1.02rem;color:var(--ink-2);}
  .cuerpo h2{font-family:'Bodoni Moda',serif;color:var(--ink);margin:32px 0 12px;font-size:1.4rem;}
  .cuerpo h3{font-family:'Bodoni Moda',serif;color:var(--ink);margin:24px 0 10px;font-size:1.15rem;}
  .cuerpo p{margin-bottom:14px;}
  .cuerpo ul,.cuerpo ol{margin:0 0 14px 22px;}
  .cuerpo li{margin-bottom:6px;}
  .cuerpo a{color:var(--accent);}
  .cuerpo img{max-width:100%;border-radius:10px;margin:20px 0;}
  .portada{width:100%;max-height:380px;object-fit:cover;border-radius:14px;margin-bottom:28px;}
  .estado{max-width:720px;margin:14vh auto;padding:0 5vw;text-align:center;color:var(--ink-3);}
  .estado a{color:var(--accent);}
  [hidden]{display:none!important;}
</style>
<meta name="google-adsense-account" content="ca-pub-8763758728010451">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8763758728010451" crossorigin="anonymous"></script>
</head>
<body>

<div class="topbar">
  <span class="breadcrumb" id="breadcrumbBox">AURZANE</span>
</div>

<main id="articleView" hidden>
  <img class="portada" id="artImg" hidden>
  <h1 id="artTitulo"></h1>
  <div class="meta" id="artMeta"></div>
  <p class="resumen" id="artResumen" hidden></p>
  <div class="cuerpo" id="artCuerpo"></div>
</main>

<div class="estado" id="notFoundState" hidden>
  <p>No encontramos este artículo, o todavía no está publicado.</p>
  <p><a href="/" id="volverLink">← Volver</a></p>
</div>

<script>
  const MUNDOS = {
    mind:   { nombre: 'MIND',   accent: '#C9A24B', home: 'https://mind.aurzane.com' },
    nexus:  { nombre: 'NEXUS',  accent: '#8A9CF0', home: 'https://nexus.aurzane.com' },
    live:   { nombre: 'LIVE',   accent: '#D19696', home: 'https://live.aurzane.com' },
    learn:  { nombre: 'LEARN',  accent: '#72ADBD', home: 'https://learn.aurzane.com' },
    build:  { nombre: 'BUILD',  accent: '#8FAF5F', home: 'https://build.aurzane.com' },
  };

  const SUPABASE_URL = 'https://chtfpqwrrarfdjcivlad.supabase.co';
  const SUPABASE_KEY = 'sb_publishable___1v6VjDew0l8uGfMyb9Nw_YyCLTPPw';
  const sb = crearClienteAurzaneID(SUPABASE_URL, SUPABASE_KEY);
  window.__aurzaneSb = sb;

  const params = new URLSearchParams(location.search);
  const mundoKey = (params.get('mundo') || '').toLowerCase();
  const slug = params.get('slug') || '';
  const mundo = MUNDOS[mundoKey];

  async function render(){
    if(!mundo || !slug){ mostrarNoEncontrado(); return; }
    document.documentElement.style.setProperty('--accent', mundo.accent);
    document.getElementById('volverLink').href = mundo.home;

    const { data, error } = await sb
      .from('articulos')
      .select('titulo,resumen,cuerpo,imagen_portada_url,seo_titulo,seo_descripcion,publicado_at,autor')
      .eq('mundo', mundoKey)
      .eq('slug', slug)
      .eq('estado', 'publicado')
      .maybeSingle();

    if(error || !data){ mostrarNoEncontrado(); return; }

    document.getElementById('breadcrumbBox').innerHTML =
      `<a href="https://aurzane.com">AURZANE</a><span class="sep">/</span><a href="${mundo.home}">${mundo.nombre}</a>`;

    document.title = (data.seo_titulo || data.titulo) + ' — AURZANE ' + mundo.nombre;
    document.getElementById('pageDesc').setAttribute('content', data.seo_descripcion || data.resumen || '');

    if(data.imagen_portada_url){
      const img = document.getElementById('artImg');
      img.src = data.imagen_portada_url;
      img.alt = data.titulo;
      img.hidden = false;
    }
    document.getElementById('artTitulo').textContent = data.titulo;
    const fecha = data.publicado_at ? new Date(data.publicado_at).toLocaleDateString('es-EC', { day:'numeric', month:'long', year:'numeric' }) : '';
    document.getElementById('artMeta').textContent = [data.autor, fecha].filter(Boolean).join(' · ');
    if(data.resumen){
      document.getElementById('artResumen').textContent = data.resumen;
      document.getElementById('artResumen').hidden = false;
    }
    document.getElementById('artCuerpo').innerHTML = marked.parse(data.cuerpo || '');
    document.getElementById('articleView').hidden = false;
  }

  function mostrarNoEncontrado(){
    document.getElementById('notFoundState').hidden = false;
  }

  render();
</script>
</body>
</html>
