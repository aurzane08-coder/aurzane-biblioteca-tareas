<script>
// Observabilidad de errores frontend (Fase 8-9 P1, ver observabilidad_errores_setup.sql).
// Se registra ANTES que cualquier otro script (incluido el SDK de Supabase) para
// no perderse errores tempranos; si todavía no existe un cliente listo, los junta
// en un buffer y los manda apenas el cliente de esta página se crea más abajo.
// Nunca incluye datos de usuario -- solo la ruta de la página y un mensaje genérico.
window.__aurzaneErrBuf = [];
window.__aurzaneLogErr = function(msg){
  var entry = { pagina: location.pathname, mensaje: String(msg == null ? 'Error desconocido' : msg).slice(0,300) };
  if(window.__aurzaneSb && window.__aurzaneSb.from){
    window.__aurzaneSb.from('frontend_error_log').insert(entry).then(function(){}, function(){});
  } else {
    window.__aurzaneErrBuf.push(entry);
  }
};
window.addEventListener('error', function(e){ window.__aurzaneLogErr(e && e.message); });
window.addEventListener('unhandledrejection', function(e){
  var r = e && e.reason;
  window.__aurzaneLogErr((r && r.message) || (r == null ? null : String(r)) || 'Promise rechazada');
});
</script>

<!-- Lógica de puntuación e interpretación del informe: compartida con portal.html -->
<script src="informe-shared.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://chtfpqwrrarfdjcivlad.supabase.co';
const SUPABASE_KEY = 'sb_publishable___1v6VjDew0l8uGfMyb9Nw_YyCLTPPw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'aurzane-admin-auth' }
});
window.__aurzaneSb = sb;
if(window.__aurzaneErrBuf.length){ window.__aurzaneErrBuf.forEach(function(en){ sb.from('frontend_error_log').insert(en).then(function(){}, function(){}); }); window.__aurzaneErrBuf.length = 0; }

function showScreen(id){
  ['loadingScreen','loginScreen','errorScreen','reportScreen'].forEach(s=>{
    document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
  });
}
function showError(title, msg){
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorMsg').textContent = msg;
  showScreen('errorScreen');
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  if(!email || !password){ errBox.textContent = 'Ingresa tu correo y contraseña.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errBox.textContent = 'No se pudo iniciar sesión: ' + error.message; return; }
  init();
});

// Registro de auditoría mínimo: generar/descargar un informe no es un
// cambio de fila, así que se inserta a mano y solo después de confirmar
// es_admin(). Si falla, no interrumpe el informe.
async function registrarEventoInforme(accion){
  if(!currentSession || !currentClienteId) return;
  try {
    const { error } = await sb.from('audit_log').insert({
      actor_id: currentSession.user.id,
      actor_role: 'admin',
      accion,
      tabla: 'clientes',
      registro_id: currentClienteId
    });
    if(error) console.warn('audit_log no registró el evento:', error.message);
  } catch(e){ console.error('No se pudo registrar en audit_log:', e); }
}

let currentSession = null;
let currentClienteId = null;
let initInFlight = null;

async function init(){
  if(initInFlight) return initInFlight;
  initInFlight = (async ()=>{
    showScreen('loadingScreen');
    const { data: { session } } = await sb.auth.getSession();
    if(!session){ showScreen('loginScreen'); return; }
    currentSession = session;

    // La sesión sola no alcanza: hay que confirmar que esta cuenta esté
    // en "administradores" antes de armar el informe de cualquier cliente.
    const { data: esAdmin, error: adminErr } = await sb.rpc('es_admin');
    if(adminErr || !esAdmin){
      await sb.auth.signOut();
      showError('Sin acceso de administrador', 'Esta cuenta no tiene permisos para generar informes. Inicia sesión con tu cuenta de administrador.');
      return;
    }

    const params = new URLSearchParams(window.location.search);
    const clienteId = params.get('cliente');
    if(!clienteId){ showError('Falta el identificador', 'Abre esta página desde el botón "Ver informe" de un cliente en el panel admin.'); return; }
    currentClienteId = clienteId;

    const { data: cliente, error } = await sb.from('clientes')
      .select('*, activaciones(*)').eq('id', clienteId).maybeSingle();
    if(error || !cliente){ showError('Cliente no encontrado', 'No pudimos cargar los datos de este cliente.'); return; }

    // El informe se arma con las evaluaciones completadas (de 1 a 6).
    const incluidos = ovpTestsDelInforme(cliente);
    if(incluidos.length === 0){
      showError('Informe todavía no disponible', (cliente.nombre || 'Este cliente') + ' todavía no completó ninguna evaluación.');
      return;
    }
    const pendientes = (cliente.activaciones || []).filter(a => a.activo && !a.completado).map(a => ovpNombreTest[a.test_key] || a.test_key);
    document.getElementById('avisoParcial').innerHTML = pendientes.length
      ? '<div class="aviso-parcial">Informe parcial: incluye ' + incluidos.length + ' evaluación(es) completada(s). Pendientes: ' + pendientes.join(', ') + '.</div>'
      : '';

    const usa = k => incluidos.includes(k);
    const vacio = Promise.resolve({ data: [] });
    const [{data: chaRows}, {data: hollandRows}, {data: af5Rows}, {data: chtRows}, {data: aptBRows}, {data: aptARows}, eleccion] = await Promise.all([
      usa('chaside') ? sb.from('respuestas_chaside').select('*').eq('cliente_id', clienteId) : vacio,
      usa('holland') ? sb.from('respuestas_holland').select('*').eq('cliente_id', clienteId) : vacio,
      usa('af5') ? sb.from('respuestas_af5').select('*').eq('cliente_id', clienteId) : vacio,
      usa('chte') ? sb.from('respuestas_chte').select('*').eq('cliente_id', clienteId) : vacio,
      usa('apt_b') ? sb.from('respuestas_apt_b').select('*').eq('cliente_id', clienteId) : vacio,
      usa('apt_a') ? sb.from('respuestas_apt_a').select('*').eq('cliente_id', clienteId) : vacio,
      OVPOpciones.resolver(sb, cliente)
    ]);

    (chaRows||[]).forEach(r => { cha_responses[r.pregunta_num] = r.respuesta; });
    holland_rows = hollandRows || [];
    (af5Rows||[]).forEach(r => { af5_responses[r.pregunta_num] = r.valor; });
    (chtRows||[]).forEach(r => { cht_responses[r.pregunta_num] = r.respuesta; });
    apt_b_rows = aptBRows || [];
    apt_a_rows = aptARows || [];

    try {
      generarInformeOVP(cliente, eleccion.membrete, incluidos, eleccion.profesional);
      // Membrete (AURZANE por defecto, o COMIL 12) y firma del informe.
      OVPOpciones.selector(document.getElementById('opcionesInforme'), eleccion, async (cambio) => {
        const { error } = await sb.from('clientes').update({ membrete_id: cambio.membrete_id, profesional_id: cambio.profesional_id }).eq('id', clienteId);
        if(error) throw new Error(error.message);
        cliente.membrete_id = cambio.membrete_id;
        cliente.profesional_id = cambio.profesional_id;
        const nueva = await OVPOpciones.resolver(sb, cliente);
        eleccion.membrete = nueva.membrete; eleccion.profesional = nueva.profesional;
        generarInformeOVP(cliente, nueva.membrete, incluidos, nueva.profesional);
        registrarEventoInforme('cambiar_membrete_firma');
      });
      showScreen('reportScreen');
      registrarEventoInforme('generar_informe');
      sb.from('clientes').update({ informe_generado_at: new Date().toISOString() }).eq('id', clienteId).then(function(){}, function(){});
    } catch(e){
      console.error(e);
      window.__aurzaneLogErr && window.__aurzaneLogErr(e && e.message ? e.message : 'Error en generación de informe');
      showError('Error al generar el informe', 'No pudimos completar la generación del informe. Revisa la conexión e inténtalo nuevamente.');
    }
  })();
  try { return await initInFlight; } finally { initInFlight = null; }
}

const cha_responses = {};
const af5_responses = {};
const cht_responses = {};
let apt_b_rows = [];
let apt_a_rows = [];
let holland_rows = [];

const btnPdf = document.getElementById('descargarPdfBtn');
const btnWord = document.getElementById('descargarWordBtn');
btnPdf.addEventListener('click', () => registrarEventoInforme('descargar_informe_pdf'));
btnWord.addEventListener('click', () => registrarEventoInforme('descargar_informe_word'));
OVPExport.conectarBotones(btnPdf, btnWord);

sb.auth.onAuthStateChange((_e, session)=>{ if(_e === 'SIGNED_IN' && session) init(); });
init();
</script>
